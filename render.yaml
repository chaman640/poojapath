# Render Blueprint — is file se Render sab kuch apne aap bana deta hai.
#
# Kaise use karein:
#   1. Is project ko GitHub par push karein
#   2. Render Dashboard > New + > Blueprint > apna repo chunein
#   3. Render database + web service dono bana dega
#   4. Deploy ke baad Environment tab me Razorpay/WhatsApp keys bhar dein
#
# Ya phir manually bhi bana sakte hain — README.md me steps diye hain.

databases:
  - name: pooja-path-db
    databaseName: poojapath
    user: poojapath
    plan: free

services:
  - type: web
    name: pooja-path
    runtime: node
    plan: free
    region: singapore # India ke sabse paas
    branch: main
    buildCommand: npm ci && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: pooja-path-db
          property: connectionString

      # Render khud ek strong random secret bana dega
      - key: AUTH_SECRET
        generateValue: true

      # ---- Ye values Render dashboard me apne hisaab se badlein ----
      - key: NEXT_PUBLIC_SITE_URL
        value: https://pooja-path.onrender.com
      - key: NEXT_PUBLIC_SITE_NAME
        value: Pooja Path
      - key: NEXT_PUBLIC_SUPPORT_PHONE
        value: "+919000000000"
      - key: NEXT_PUBLIC_SUPPORT_WHATSAPP
        value: "+919000000000"
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: support@poojapath.in

      # Pehla admin account (login karte hi password badal dena)
      - key: ADMIN_EMAIL
        value: admin@poojapath.in
      - key: ADMIN_PASSWORD
        sync: false # Render poochhega — yahan likhna mat

      # ---- Razorpay (baad me bharein) ----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ---- WhatsApp (baad me bharein) ----
      - key: WHATSAPP_PROVIDER
        value: none
      - key: AISENSY_API_KEY
        sync: false
      - key: AISENSY_CAMPAIGN_BOOKING
        value: booking_confirmed
      - key: AISENSY_CAMPAIGN_STATUS
        value: booking_status_update
      - key: INTERAKT_API_KEY
        sync: false
      - key: INTERAKT_TEMPLATE_BOOKING
        value: booking_confirmed
      - key: INTERAKT_TEMPLATE_STATUS
        value: booking_status_update
